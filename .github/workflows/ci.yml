name: CI

on:
  pull_request:
  push:
    branches: [master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Unit tests, lint, demo build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests
        run: ./gradlew :segmentifyandroidsdk:testDebugUnitTest --stacktrace

      - name: Lint
        run: ./gradlew :segmentifyandroidsdk:lintDebug

      - name: Build demo app
        run: ./gradlew :app:assembleDebug

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            segmentifyandroidsdk/build/reports
            segmentifyandroidsdk/build/test-results
          if-no-files-found: ignore

apply plugin: 'com.android.library'
apply plugin: 'kotlin-android'
apply from: 'maven-push.gradle'

buildscript {
    ext.kotlin_version = '2.2.0'
}

android {
    compileSdkVersion 36

    defaultConfig {
        minSdkVersion 24
        targetSdkVersion 36
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        buildConfigField "String", "SDK_VERSION", "\"${VERSION_NAME}\""
    }

    buildFeatures {
        buildConfig = true
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    namespace = 'com.segmentify.segmentifyandroidsdk'

    lint {
        abortOnError = false
    }

    testOptions {
        // android.util.Log and friends are stubs on the JVM; return defaults instead of throwing.
        unitTests.returnDefaultValues = true
        // Robolectric tests read the merged manifest and resources.
        unitTests.includeAndroidResources = true
        // Print the assertion message of a failed test in the build log.
        unitTests.all {
            testLogging {
                events "failed"
                exceptionFormat "full"
            }
            // Robolectric otherwise downloads its Android runtime from Maven
            // Central while the tests run, which fails often on CI. Gradle
            // resolves it instead (cached, retried) and Robolectric reads it
            // from disk.
            dependsOn 'copyRobolectricRuntime'
            systemProperty 'robolectric.offline', 'true'
            systemProperty 'robolectric.dependency.dir', layout.buildDirectory.dir('robolectric-runtime').get().asFile.absolutePath
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    kotlinOptions {
        jvmTarget = '11'
    }
}

// The Android runtimes Robolectric 4.14.1 loads: 14 for @Config(sdk = 34) and
// 15, its newest, which it uses to read resources. Each one is resolved in its
// own configuration; in a shared one Gradle would keep only the newer version.
def robolectricRuntimeVersions = ['14-robolectric-10818077-i7', '15-robolectric-12650502-i7']

tasks.register('copyRobolectricRuntime', Copy) {
    robolectricRuntimeVersions.each { version ->
        def runtime = configurations.detachedConfiguration(
                dependencies.create("org.robolectric:android-all-instrumented:${version}"))
        runtime.transitive = false
        from runtime
    }
    into layout.buildDirectory.dir('robolectric-runtime')
}

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar'])

    implementation "androidx.appcompat:appcompat:1.7.1"

    // JSON ve HTTP
    implementation 'com.google.code.gson:gson:2.10.1'
    implementation 'com.squareup.retrofit2:retrofit:2.11.0'
    implementation 'com.squareup.retrofit2:converter-gson:2.11.0'
    implementation 'com.squareup.okhttp3:logging-interceptor:3.8.1'

    // Kotlin
    implementation "org.jetbrains.kotlin:kotlin-stdlib-jdk8:$kotlin_version"

    testImplementation 'junit:junit:4.13.2'
    // End-to-end tests of the SDK singletons: real SharedPreferences and main
    // looper from Robolectric, a local HTTP server instead of the backend.
    testImplementation 'org.robolectric:robolectric:4.14.1'
    // Same version as the OkHttp that Retrofit 2.11.0 brings in.
    testImplementation 'com.squareup.okhttp3:mockwebserver:3.14.9'
    androidTestImplementation 'androidx.test:runner:1.7.0'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.7.0'
}

repositories {
    mavenCentral()
}
